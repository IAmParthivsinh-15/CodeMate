apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: codemate
  labels: { app: codemate, role: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: codemate, role: frontend } }
  template:
    metadata:
      labels: { app: codemate, role: frontend }
    spec:
      containers:
        - name: frontend
          image: parthivsinhv/codemate-frontend:latest
          # nginx proxies /api and /socket.io in-cluster, so the browser uses one origin.
          env:
            - { name: API_UPSTREAM, value: "api.codemate.svc.cluster.local:5050" }
            - { name: REALTIME_UPSTREAM, value: "realtime.codemate.svc.cluster.local:5050" }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: codemate }
spec:
  selector: { app: codemate, role: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
