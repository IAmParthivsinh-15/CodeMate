# Template only. Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f infrastructure/kubernetes/secret.yaml
# Better: create it from your secret manager (External Secrets, Sealed Secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: codemate-secrets
  namespace: codemate
type: Opaque
stringData:
  MONGO_URL: "mongodb+srv://USER:PASSWORD@cluster.example.mongodb.net/codemate"
  ACCESS_TOKEN_SECRET: "generate-with: openssl rand -hex 32"
  REFRESH_TOKEN_SECRET: "generate-with: openssl rand -hex 32"
  ACCESS_TOKEN_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
  REDIS_URL: "rediss://default:PASSWORD@redis.example.com:6380"
  KAFKA_BROKERS: "broker-1.example.com:9092,broker-2.example.com:9092"
  VECTOR_DB_URL: ""
  VECTOR_DB_API_KEY: ""
  JUDGE0_API_URL: "https://judge0-ce.p.rapidapi.com"
  JUDGE0_API_KEY: ""
  GROQ_API_KEY: ""
  NVIDIA_API_KEY: ""
  GEMINI_API_KEY: ""
