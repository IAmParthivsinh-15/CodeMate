# GitHub Actions CI for CodeMate (spec §46).
#
# Kept here, in a visible folder, per the team's "no hidden folders" rule.
# GitHub only runs workflows from .github/workflows/, so to activate it:
#   mkdir -p .github/workflows && cp infrastructure/ci/github-actions-ci.yml .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-retries 10
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: chmod +x engine/stockfish
      - run: npm test

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile
          tags: codemate-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          tags: codemate-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke-test the backend image
        run: |
          docker network create ci
          docker run -d --name mongo --network ci mongo:7
          docker run -d --name api --network ci -p 5050:5050 \
            -e MONGO_URL=mongodb://mongo:27017/codemate \
            -e ACCESS_TOKEN_SECRET=ci-access-secret-0123456789 \
            -e REFRESH_TOKEN_SECRET=ci-refresh-secret-0123456789 \
            codemate-backend:ci
          for i in $(seq 1 30); do curl -fs localhost:5050/ready && break; sleep 2; done
          curl -fs localhost:5050/ready
      - name: Scan images (report only)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: codemate-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
