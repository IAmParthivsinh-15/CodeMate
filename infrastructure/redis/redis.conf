# CodeMate uses Redis for ephemeral state only (spec §11): live game state,
# presence, matchmaking queues, rate-limit counters, caches. MongoDB is the
# source of truth, so persistence is off.
save ""
appendonly no

# Nearly every key has a TTL. Evict among those first, so matchmaking queue
# sorted sets (no TTL) aren't dropped under memory pressure.
maxmemory 256mb
maxmemory-policy volatile-lru
