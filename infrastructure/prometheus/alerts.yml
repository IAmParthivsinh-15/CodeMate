groups:
  - name: codemate
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_errors_total[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of HTTP requests are failing with 5xx" }
      - alert: SlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!~".*analyze.*"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 API latency above 1s" }
      - alert: KafkaConsumerLag
        expr: max by (group) (kafka_consumer_lag) > 500
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Consumer group {{ $labels.group }} is falling behind" }
      - alert: LlmErrors
        expr: sum(rate(llm_errors_total[10m])) > 0.1
        for: 10m
        labels: { severity: info }
        annotations: { summary: "LLM calls failing; users get deterministic fallbacks" }
      - alert: EventHandlerErrors
        expr: sum by (group) (rate(events_processed_total{outcome="error"}[10m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Worker {{ $labels.group }} keeps failing events" }
