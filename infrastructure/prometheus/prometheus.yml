# Scrapes every CodeMate process role (each exposes GET /metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: codemate
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5050"]
        labels: { service: api }
      - targets: ["realtime:5050"]
        labels: { service: realtime }
      - targets: ["worker:5050"]
        labels: { service: worker }
