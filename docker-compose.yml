# CodeMate local stack (spec §44).
#
#   cp .env.example .env         # fill in secrets (JWT secrets at minimum)
#   docker compose up --build    # app on http://localhost:8080
#   docker compose --profile observability up   # + Prometheus :9090, Grafana :3000
#
# API, realtime gateway and workers are the same backend image started with
# different SERVICE_ROLEs (docs/architecture/service-boundaries.md).

x-backend: &backend
  image: codemate-backend:local
  build:
    context: .
    dockerfile: infrastructure/docker/backend/Dockerfile
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    PORT: "5050"
    MONGO_URL: mongodb://mongodb:27017/codemate
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    VECTOR_DB_URL: http://qdrant:6333
    CORS_ORIGINS: http://localhost:8080
  restart: unless-stopped
  depends_on:
    mongodb: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    qdrant: { condition: service_started }

services:
  mongodb:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes: [./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 15

  # Creates the versioned topics (docs/events/kafka-events.md) before any consumer starts.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes: [./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["sh", "/create-topics.sh", "kafka:9092"]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["6333:6333"]

  api:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_ROLE: api

  realtime:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_ROLE: realtime

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_ROLE: worker
      WORKERS: analysis,ai,coding,analytics

  frontend:
    image: codemate-frontend:local
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    environment:
      API_UPSTREAM: api:5050
      REALTIME_UPSTREAM: realtime:5050
    ports: ["8080:80"]
    depends_on: [api, realtime]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mongo-data:
  kafka-data:
  qdrant-data:
